name: Facebook Pages MCP CI

on:
  pull_request:
    paths:
      - "facebook-pages-mcp/**"
      - ".github/workflows/facebook-pages-mcp.yml"
  push:
    branches: [main]
    paths:
      - "facebook-pages-mcp/**"
      - ".github/workflows/facebook-pages-mcp.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: facebook-pages-mcp

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: facebook-pages-mcp/package-lock.json
      - run: npm ci
      - run: npm run verify

  production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: facebook-pages-mcp/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
